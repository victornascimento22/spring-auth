services:
  app:
    container_name: spring-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - spring-network

networks:
  spring-network:
    driver: bridge  # Usando o driver bridge para uma rede personalizada
