services:
  app:
    container_name: spring-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/dev
      - SPRING_DATASOURCE_USERNAME=dev
      - SPRING_DATASOURCE_PASSWORD=123
    networks:
      - spring-network
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: postgres
    image: postgres:16
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=dev
    networks:
      - spring-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  spring-network:
    driver: bridge
    name: spring-network
  pg-network:
    driver: bridge
    name: pg-network  # Garantindo que o nome da rede seja exatamente 'pg-network'

volumes:
  db-data: